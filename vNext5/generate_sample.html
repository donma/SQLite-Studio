CREATE TABLE users (
    id INTEGER PRIMARY KEY AUTOINCREMENT,
    username TEXT NOT NULL UNIQUE,
    email TEXT NOT NULL,
    password_hash TEXT NOT NULL,
    avatar_url TEXT,
    role TEXT NOT NULL DEFAULT 'user',

    slug TEXT NOT NULL UNIQUE,
    description TEXT,
    parent_id INTEGER,
    sort_order INTEGER DEFAULT 0,

    excerpt TEXT,

CREATE INDEX idx_posts_status ON posts(status);

CREATE INDEX idx_comments_post ON comments(post_id);
CREATE INDEX idx_comments_user ON comments(user_id);
CREATE INDEX idx_audit_user ON audit_logs(user_id);
CREATE INDEX idx_audit_table ON audit_logs(table_name);

-- Views
CREATE VIEW v_post_stats AS
SELECT
    p.id, p.title, u.username AS author, c.name AS category,
    p.status, p.view_count,
    (SELECT COUNT(*) FROM comments WHERE post_id = p.id) AS comment_count,
    (SELECT COUNT(*) FROM post_tags WHERE post_id = p.id) AS tag_count,
    p.published_at
FROM posts p
LEFT JOIN users u ON p.author_id = u.id
LEFT JOIN categories c ON p.category_id = c.id;

CREATE VIEW v_popular_posts AS
SELECT p.*, u.username AS author_name
FROM posts p
JOIN users u ON p.author_id = u.id
WHERE p.status = 'published'
ORDER BY p.view_count DESC
LIMIT 10;

-- Triggers
CREATE TRIGGER trg_post_update AFTER UPDATE ON posts
BEGIN
    UPDATE posts SET updated_at = datetime('now') WHERE id = NEW.id;
END;

CREATE TRIGGER trg_audit_user_delete BEFORE DELETE ON users
BEGIN
    INSERT INTO audit_logs (user_id, action, table_name, record_id, old_value)
    VALUES (OLD.id, 'DELETE', 'users', OLD.id, OLD.username || ' (' || OLD.email || ')');
END;

    function log(msg) {
      document.getElementById('log').textContent += msg + '\n';
    }

    function setStatus(msg, ok) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = ok ? 'ok' : 'err';
    }

    async function generate() {
      try {
        log('Loading sql.js...');
        const SQL = await initSqlJs();
        log('Creating database...');

        const db = new SQL.Database();
        const statements = SQL_DATA.split(';').map(s => s.trim()).filter(s => s.length > 0);
        let count = 0;
        for (const stmt of statements) {
          try {
            db.run(stmt);
            count++;
          } catch (e) {
            log('ERROR: ' + e.message);
            log('  Statement: ' + stmt.substring(0, 80) + '...');
          }
        }
        log('Executed ' + count + ' statements');

        const data = db.export();
        const blob = new Blob([data], { type: 'application/x-sqlite' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'sample.sqlite';
        a.click();
        URL.revokeObjectURL(a.href);

        log('Database size: ' + data.length + ' bytes');
        setStatus('Done! sample.sqlite downloaded. Place it in the project folder.', true);
      } catch (e) {
        log('FATAL: ' + e.message);
        setStatus('Error: ' + e.message, false);
      }
    }
