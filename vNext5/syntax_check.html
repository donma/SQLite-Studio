<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body><pre id="output"></pre><script>
const files = ['app.js','autocomplete.js','db.js','editor.js','enhancements.js','enhancements2.js','erd.js','sample-db.js','sql-utils.js','storage.js','table.js','ui.js'];
const output = document.getElementById('output');

async function checkFiles() {
    for (const f of files) {
        try {
            const resp = await fetch('js/' + f);
            const code = await resp.text();
            try {
                new Function(code);
                output.textContent += f + ' - OK\n';
            } catch(e) {
                output.textContent += f + ' - SYNTAX ERROR: ' + e.message + '\n';
            }
        } catch(e) {
            output.textContent += f + ' - FETCH ERROR: ' + e.message + '\n';
        }
    }
}
checkFiles();
</script></body></html>
